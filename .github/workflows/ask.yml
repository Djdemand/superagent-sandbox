name: ask-superagent
on:
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the agent for work on issue 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 1 --repo "${{ github.repository }}" --body "@djdemand Add a second-level heading Sandbox to README.md with the sentence: This repository exists only to test dsh-superagent. Change only README.md and open a pull request against main."